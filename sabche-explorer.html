<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabche Explorer — Wisdom Chapter</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --border: #e2d9c8;
      --text: #1c1a17;
      --text-muted: #6b5f50;
      --accent: #8b2c2c;
      --selected-bg: #fef5e7;
      --selected-border: #c46a1a;
      --match-bg: #fffde7;
      --header-bg: #231208;
      --header-text: #f5e6c8;
      --controls-bg: #f0e9dd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ─────────────────────────────────────── */
    .app-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 14px 22px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .header-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9a7a5a;
      margin-bottom: 3px;
    }

    .header-tib {
      font-family: 'Noto Sans Tibetan', serif;
      font-size: 20px;
      line-height: 2.0;
      color: var(--header-text);
      display: block;
    }

    .header-en {
      font-size: 12px;
      color: #c0996a;
      font-style: italic;
      display: block;
      margin-top: -4px;
    }

    /* ── Controls bar ───────────────────────────────── */
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 22px;
      background: var(--controls-bg);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      padding: 6px 10px 6px 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      background: white;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-box:focus {
      border-color: var(--selected-border);
      box-shadow: 0 0 0 2px rgba(196,106,26,0.18);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      padding: 0;
      line-height: 1;
      display: none;
    }

    .search-clear.visible { display: block; }

    .btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap;
      transition: background 0.1s, border-color 0.1s;
    }

    .btn:hover {
      background: var(--controls-bg);
      border-color: #c0a880;
    }

    .btn:active { opacity: 0.8; }

    .divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    .search-count {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 60px;
    }

    /* ── Breadcrumb ─────────────────────────────────── */
    .breadcrumb-bar {
      padding: 6px 22px;
      background: #fffdf8;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .breadcrumb-bar.empty {
      color: #b8a890;
      font-style: italic;
    }

    .crumb {
      cursor: pointer;
      color: #8b4c1a;
      font-weight: 500;
      padding: 1px 3px;
      border-radius: 3px;
      transition: background 0.1s;
    }

    .crumb:hover { background: #fce8cc; }

    .crumb-tib {
      font-family: 'Noto Sans Tibetan', serif;
      font-size: 12px;
      line-height: 1.8;
    }

    .crumb-sep { color: #cfc0a8; margin: 0 1px; }

    .crumb-id {
      font-size: 10px;
      color: #b09070;
      font-weight: 600;
      margin-right: 3px;
    }

    /* ── Tree container ─────────────────────────────── */
    .tree-container {
      padding: 14px 16px 60px;
      max-width: 860px;
    }

    /* ── Node ───────────────────────────────────────── */
    .tree-node { position: relative; }

    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 6px 3px 0;
      border-radius: 6px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background 0.1s;
      margin-bottom: 1px;
    }

    .node-row:hover { background: rgba(0,0,0,0.04); }

    .node-row.selected {
      background: var(--selected-bg) !important;
      border-left-color: var(--selected-border) !important;
    }

    .node-row.search-match { background: var(--match-bg); }

    .toggle-btn {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #a09080;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 6px;
      border-radius: 3px;
      transition: background 0.1s, color 0.1s;
    }

    .toggle-btn:hover { background: rgba(0,0,0,0.08); color: var(--text); }

    .toggle-btn.leaf { cursor: default; color: transparent; pointer-events: none; }

    .toggle-arrow { display: inline-block; transition: transform 0.15s; }
    .toggle-arrow.open { transform: rotate(90deg); }

    .node-content { flex: 1; min-width: 0; padding: 2px 0; }

    .node-id {
      font-size: 10px;
      color: #b89870;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-right: 5px;
      font-variant-numeric: tabular-nums;
    }

    .node-tib {
      font-family: 'Noto Sans Tibetan', serif;
      font-size: 15px;
      line-height: 2.0;
      color: var(--text);
      word-break: break-word;
    }

    .node-en {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      display: block;
      margin-top: -3px;
      margin-left: 0;
      word-break: break-word;
    }

    /* ── Children container ─────────────────────────── */
    .children-wrap {
      padding-left: 22px;
      border-left: 1px dashed #ddd0b8;
      margin-left: 10px;
      overflow: hidden;
    }

    .children-wrap.collapsed { display: none; }

    /* ── Depth left-border colors ───────────────────── */
    .depth-0 > .node-row { border-left-color: #7c2d2d; }
    .depth-1 > .node-row { border-left-color: #a04020; }
    .depth-2 > .node-row { border-left-color: #c46a1a; }
    .depth-3 > .node-row { border-left-color: #c49a0a; }
    .depth-4 > .node-row { border-left-color: #7a9020; }
    .depth-5 > .node-row { border-left-color: #2a7a50; }
    .depth-6 > .node-row { border-left-color: #1a6888; }
    .depth-7 > .node-row { border-left-color: #2a4a9a; }
    .depth-8 > .node-row { border-left-color: #5a2a9a; }
    .depth-9 > .node-row { border-left-color: #8a1a7a; }
    .depth-10 > .node-row { border-left-color: #aa1a4a; }
    .depth-11 > .node-row { border-left-color: #7c2d2d; }

    /* Depth indicator dot */
    .depth-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 9px;
      margin-right: 2px;
      opacity: 0.5;
    }

    /* ── Search highlight ───────────────────────────── */
    mark {
      background: #ffe082;
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── Hidden (search mode) ───────────────────────── */
    .node-hidden { display: none !important; }

    /* ── Node count badge ───────────────────────────── */
    .child-count {
      font-size: 10px;
      color: #b09070;
      background: #f0e8d8;
      border-radius: 8px;
      padding: 0 5px;
      margin-left: 4px;
      vertical-align: middle;
      font-style: normal;
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 600px) {
      .app-header { padding: 12px 14px 10px; }
      .controls { padding: 8px 14px; }
      .breadcrumb-bar { padding: 6px 14px; }
      .tree-container { padding: 10px 8px 40px; }
      .header-tib { font-size: 17px; }
      .children-wrap { padding-left: 14px; margin-left: 6px; }
    }

    /* ── Smooth scroll offset ───────────────────────── */
    .tree-anchor { scroll-margin-top: 140px; }
  </style>
</head>

// ═══════════════════════════════════════════════
//  BUILD FLAT INDEX
// ═══════════════════════════════════════════════
const nodeIndex = {}; // id → { node, parentId, depth }

function buildIndex(nodes, parentId, depth) {
  for (const node of nodes) {
    nodeIndex[node.id] = { node, parentId, depth };
    if (node.children && node.children.length) {
      buildIndex(node.children, node.id, depth + 1);
    }
  }
}
buildIndex(DATA.nodes, null, 0);

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const state = {
  expanded: new Set(),
  selected: null,
  query: ''
};

// Default: expand depth 0 and 1
Object.values(nodeIndex).forEach(({ node, depth }) => {
  if (depth <= 1) state.expanded.add(node.id);
});

// ═══════════════════════════════════════════════
//  DEPTH COLORS
// ═══════════════════════════════════════════════
const DEPTH_COLORS = [
  '#7c2d2d','#a04020','#c46a1a','#c49a0a',
  '#7a9020','#2a7a50','#1a6888','#2a4a9a',
  '#5a2a9a','#8a1a7a','#aa1a4a','#7c2d2d'
];

function depthColor(d) {
  return DEPTH_COLORS[Math.min(d, DEPTH_COLORS.length - 1)];
}

// ═══════════════════════════════════════════════
//  SEARCH HELPERS
// ═══════════════════════════════════════════════
function getMatchingIds(q) {
  if (!q) return null;
  const lq = q.toLowerCase();
  const matches = new Set();
  const visible = new Set(); // matches + all their ancestors

  Object.values(nodeIndex).forEach(({ node }) => {
    if (
      node.tib.toLowerCase().includes(lq) ||
      node.en.toLowerCase().includes(lq) ||
      node.id.toLowerCase().includes(lq)
    ) {
      matches.add(node.id);
    }
  });

  // Collect ancestors for each match
  matches.forEach(id => {
    visible.add(id);
    let cur = nodeIndex[id];
    while (cur && cur.parentId) {
      visible.add(cur.parentId);
      cur = nodeIndex[cur.parentId];
    }
  });

  return { matches, visible };
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const escaped = escHtml(text);
  const escapedQ = escHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(escapedQ, 'gi'), m => `<mark>${m}</mark>`);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function renderTree() {
  const container = document.getElementById('treeContainer');
  const searchResult = state.query ? getMatchingIds(state.query) : null;
  container.innerHTML = '';

  for (const node of DATA.nodes) {
    const el = renderNode(node, 0, searchResult);
    if (el) container.appendChild(el);
  }

  // Update search count
  const countEl = document.getElementById('searchCount');
  if (searchResult) {
    const n = searchResult.matches.size;
    countEl.textContent = n === 0 ? 'No matches' : `${n} match${n !== 1 ? 'es' : ''}`;
  } else {
    countEl.textContent = '';
  }
}

function renderNode(node, depth, searchResult) {
  const { node: n } = nodeIndex[node.id] || {};
  const actualDepth = nodeIndex[node.id] ? nodeIndex[node.id].depth : depth;
  const hasChildren = node.children && node.children.length > 0;
  const isExpanded = state.expanded.has(node.id);
  const isSelected = state.selected === node.id;
  const q = state.query;

  // Search filtering
  if (searchResult) {
    if (!searchResult.visible.has(node.id)) return null;
  }

  const isMatch = searchResult && searchResult.matches.has(node.id);

  const wrapper = document.createElement('div');
  wrapper.className = `tree-node depth-${actualDepth} tree-anchor`;
  wrapper.dataset.id = node.id;

  // ── Node row
  const row = document.createElement('div');
  row.className = 'node-row' +
    (isSelected ? ' selected' : '') +
    (isMatch ? ' search-match' : '');
  row.style.borderLeftColor = !isSelected ? depthColor(actualDepth) : '';

  // Toggle button
  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'toggle-btn' + (hasChildren ? '' : ' leaf');
  toggleBtn.setAttribute('aria-label', isExpanded ? 'Collapse' : 'Expand');
  if (hasChildren) {
    const arrow = document.createElement('span');
    arrow.className = 'toggle-arrow' + (isExpanded ? ' open' : '');
    arrow.textContent = '▶';
    toggleBtn.appendChild(arrow);
    toggleBtn.addEventListener('click', e => {
      e.stopPropagation();
      toggleExpand(node.id);
    });
  }

  // Node content
  const content = document.createElement('div');
  content.className = 'node-content';

  const tibSpan = document.createElement('span');
  tibSpan.className = 'node-tib';
  tibSpan.innerHTML =
    `<span class="node-id">${escHtml(node.id)}</span>` +
    highlight(node.tib, q);

  const enSpan = document.createElement('span');
  enSpan.className = 'node-en';
  enSpan.innerHTML = highlight(node.en, q);
  if (hasChildren) {
    enSpan.innerHTML += ` <span class="child-count">${node.children.length}</span>`;
  }

  content.appendChild(tibSpan);
  content.appendChild(enSpan);

  row.appendChild(toggleBtn);
  row.appendChild(content);

  row.addEventListener('click', () => selectNode(node.id));

  wrapper.appendChild(row);

  // ── Children
  if (hasChildren) {
    const childWrap = document.createElement('div');
    childWrap.className = 'children-wrap' + (isExpanded || searchResult ? '' : ' collapsed');
    childWrap.dataset.parentId = node.id;

    for (const child of node.children) {
      const childEl = renderNode(child, actualDepth + 1, searchResult);
      if (childEl) childWrap.appendChild(childEl);
    }

    wrapper.appendChild(childWrap);
  }

  return wrapper;
}

// ═══════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════
function toggleExpand(id) {
  if (state.expanded.has(id)) {
    state.expanded.delete(id);
  } else {
    state.expanded.add(id);
  }
  renderTree();
  // Re-select to update breadcrumb
  updateBreadcrumb();
}

function selectNode(id) {
  state.selected = (state.selected === id) ? null : id;
  // Expand ancestors
  if (state.selected) {
    let cur = nodeIndex[id];
    while (cur && cur.parentId) {
      state.expanded.add(cur.parentId);
      cur = nodeIndex[cur.parentId];
    }
  }
  renderTree();
  updateBreadcrumb();

  // Scroll selected node into view
  if (state.selected) {
    const el = document.querySelector(`[data-id="${CSS.escape(state.selected)}"]`);
    if (el) {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }
  }
}

function getBreadcrumb(id) {
  const path = [];
  let cur = nodeIndex[id];
  while (cur) {
    path.unshift(cur.node);
    cur = cur.parentId ? nodeIndex[cur.parentId] : null;
  }
  return path;
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!state.selected) {
    bc.className = 'breadcrumb-bar empty';
    bc.innerHTML = 'Click any node to mark your place';
    return;
  }

  const path = getBreadcrumb(state.selected);
  bc.className = 'breadcrumb-bar';
  bc.innerHTML = path.map((node, i) => {
    const isLast = i === path.length - 1;
    return `<span class="crumb" data-crumb-id="${escHtml(node.id)}" title="${escHtml(node.en)}">
      <span class="crumb-id">${escHtml(node.id)}</span><span class="crumb-tib">${escHtml(node.tib)}</span>
    </span>${isLast ? '' : '<span class="crumb-sep">›</span>'}`;
  }).join('');

  bc.querySelectorAll('.crumb').forEach(el => {
    el.addEventListener('click', () => selectNode(el.dataset.crumbId));
  });
}

function expandAll() {
  Object.keys(nodeIndex).forEach(id => state.expanded.add(id));
  renderTree();
  updateBreadcrumb();
}

function collapseAll() {
  state.expanded.clear();
  renderTree();
  updateBreadcrumb();
}

// ═══════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════
let searchTimer = null;

document.getElementById('searchBox').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value.trim();
    const clearBtn = document.getElementById('searchClear');
    clearBtn.classList.toggle('visible', state.query.length > 0);
    renderTree();
    updateBreadcrumb();
  }, 180);
});

document.getElementById('searchClear').addEventListener('click', () => {
  document.getElementById('searchBox').value = '';
  state.query = '';
  document.getElementById('searchClear').classList.remove('visible');
  renderTree();
  updateBreadcrumb();
});

document.getElementById('btnExpandAll').addEventListener('click', expandAll);
document.getElementById('btnCollapseAll').addEventListener('click', collapseAll);

// ═══════════════════════════════════════════════
//  KEYBOARD NAVIGATION
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.query) {
      document.getElementById('searchBox').value = '';
      state.query = '';
      document.getElementById('searchClear').classList.remove('visible');
      renderTree();
    } else if (state.selected) {
      state.selected = null;
      renderTree();
      updateBreadcrumb();
    }
  }
  if ((e.key === 'f' || e.key === 'F') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    document.getElementById('searchBox').focus();
  }
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
renderTree();
updateBreadcrumb();
